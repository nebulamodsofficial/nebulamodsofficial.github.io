<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake Game</title>
<style>
body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background-color:#4A752C;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none}
#gameContainer{display:flex;flex-direction:column;width:90vmin;max-width:400px;box-shadow:0 8px 16px rgba(0,0,0,.3);border-radius:8px;overflow:hidden}
#topBar{height:50px;background-color:#4E7A2F;display:flex;align-items:center;justify-content:space-between;position:relative;padding:0 8px;box-sizing:border-box}
.stat{color:white;font-size:15px;font-weight:bold;white-space:nowrap}
#pauseBtn{position:relative;right:auto;top:auto;background-color:#1565C0;color:white;border:none;padding:6px 9px;font-size:12px;font-weight:bold;border-radius:15px;cursor:pointer;margin:0;flex-shrink:0}
#pauseBtn:hover{background-color:#0D47A1}
#canvasWrapper{width:100%;aspect-ratio:1/1;background-color:#A2D149;position:relative}
canvas{display:block;width:100%;height:100%}
#menu{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(74,117,44,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;padding:20px;box-sizing:border-box;text-align:center}
button{background-color:#1565C0;color:white;border:none;padding:12px 30px;font-size:18px;font-weight:bold;border-radius:25px;cursor:pointer;margin-top:15px}
button:hover{background-color:#0D47A1}
#pauseBtn{margin-top:0}
.color-selector{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:15px 0;max-width:300px}
.color-btn{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer;outline:none;padding:0;transition:transform .1s}
.color-btn:hover{transform:scale(1.1)}
.color-btn.selected{border-color:white;transform:scale(1.2);box-shadow:0 0 8px rgba(255,255,255,.8)}
</style>
</head>
<body>

<div id="gameContainer">

<div id="topBar">
<div class="stat"><span id="scoreLabel">0 Apples</span></div>
<div class="stat">Top: <span id="highScore">0</span></div>
<div class="stat">Wins: <span id="winsLabel">0</span></div>
<button id="pauseBtn" onclick="togglePause()">Pause</button>
</div>

<div id="canvasWrapper">

<canvas id="gameCanvas" width="400" height="400"></canvas>

<div id="menu">

<h2 id="menuTitle" style="margin:0 0 10px 0;font-size:28px;">Snake Game</h2>

<div id="colorLabel" style="font-size:14px;color:#E0E0E0;">
Choose Snake Color:
</div>

<div class="color-selector" id="colorSelector">

<button class="color-btn selected" style="background-color:#4674E9" data-color="#4674E9" title="Blue"></button>
<button class="color-btn" style="background-color:#E23A24" data-color="#E23A24" title="Red"></button>
<button class="color-btn" style="background-color:#FF9233" data-color="#FF9233" title="Orange"></button>
<button class="color-btn" style="background-color:#FFDD33" data-color="#FFDD33" title="Yellow"></button>
<button class="color-btn" style="background-color:#00E5FF" data-color="#00E5FF" title="Cyan"></button>
<button class="color-btn" style="background-color:#7B1FA2" data-color="#7B1FA2" title="Purple"></button>
<button class="color-btn" style="background-color:#D81B60" data-color="#D81B60" title="Magenta"></button>
<button class="color-btn" style="background-color:#FF8A80" data-color="#FF8A80" title="Pink"></button>
<button class="color-btn" style="background-color:#FFFFFF" data-color="#FFFFFF" title="White"></button>
<button class="color-btn" style="background-color:#111111" data-color="#111111" title="Black"></button>

</div>

<button id="startBtn" onclick="startGame()">PLAY</button>

</div>
</div>
</div>

<script>
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');

const scoreLabelEl=document.getElementById('scoreLabel');
const highScoreEl=document.getElementById('highScore');
const winsLabelEl=document.getElementById('winsLabel');

const menuEl=document.getElementById('menu');
const menuTitleEl=document.getElementById('menuTitle');

const colorSelectorEl=document.getElementById('colorSelector');
const colorLabelEl=document.getElementById('colorLabel');

const pauseBtn=document.getElementById('pauseBtn');

const gridSize=20;
const tileCount=20;
const maxPossibleScore=(tileCount*tileCount)-3;

const SAVE_KEY='snakeGameProgress';

let snake=[];
let food={x:0,y:0};

let dx=gridSize;
let dy=0;

let score=0;
let highScore=0;
let wins=0;

let gameInterval=null;
let changingDirection=false;

let selectedColor='#4674E9';

let touchStartX=0;
let touchStartY=0;

let isPaused=false;

function saveProgress(){
    try{
        localStorage.setItem(
            SAVE_KEY,
            JSON.stringify({
                wins:wins,
                top:highScore,
                color:selectedColor
            })
        );
    }catch(e){}
}

function loadProgress(){

    try{

        const saved=localStorage.getItem(SAVE_KEY);

        if(saved){

            const data=JSON.parse(saved);

            if(typeof data.wins==='number'){
                wins=data.wins;
            }

            if(typeof data.top==='number'){
                highScore=data.top;
            }

            if(
                typeof data.color==='string'&&
                /^#[0-9A-F]{6}$/i.test(data.color)
            ){
                selectedColor=data.color;
            }
        }

    }catch(e){}

    highScoreEl.innerText=highScore;
    winsLabelEl.innerText=wins;

    updateColorSelection();
}

function updateColorSelection(){

    document.querySelectorAll('.color-btn').forEach(btn=>{

        btn.classList.toggle(
            'selected',
            btn.getAttribute('data-color')===selectedColor
        );

    });
}

colorSelectorEl.addEventListener('click',e=>{

    if(!e.target.classList.contains('color-btn')){
        return;
    }

    document.querySelectorAll('.color-btn').forEach(btn=>{
        btn.classList.remove('selected');
    });

    e.target.classList.add('selected');

    selectedColor=
        e.target.getAttribute('data-color');

    saveProgress();
});

function getSecondaryColor(hex){

    if(hex==='#FFFFFF'){
        return '#E0E0E0';
    }

    if(hex==='#111111'){
        return '#222222';
    }

    return adjustColorBrightness(hex,15);
}

function getTertiaryColor(hex){

    if(hex==='#FFFFFF'){
        return '#CCCCCC';
    }

    if(hex==='#111111'){
        return '#333333';
    }

    return adjustColorBrightness(hex,25);
}

function adjustColorBrightness(hex,percent){

    let R=parseInt(hex.substring(1,3),16);
    let G=parseInt(hex.substring(3,5),16);
    let B=parseInt(hex.substring(5,7),16);

    R=Math.min(
        parseInt(R*(100+percent)/100),
        255
    );

    G=Math.min(
        parseInt(G*(100+percent)/100),
        255
    );

    B=Math.min(
        parseInt(B*(100+percent)/100),
        255
    );

    return '#'+
        R.toString(16).padStart(2,'0')+
        G.toString(16).padStart(2,'0')+
        B.toString(16).padStart(2,'0');
}

function updateScoreDisplay(){

    scoreLabelEl.innerText=
        score===1
        ?'1 Apple'
        :score+' Apples';
}

function addApple(x=null,y=null){

    if(x!==null&&y!==null){

        x=Number(x);
        y=Number(y);

        if(
            !Number.isInteger(x)||
            !Number.isInteger(y)||
            x<0||
            x>=tileCount||
            y<0||
            y>=tileCount
        ){
            return false;
        }

        const appleX=x*gridSize;
        const appleY=y*gridSize;

        for(const part of snake){

            if(
                part.x===appleX&&
                part.y===appleY
            ){
                return false;
            }
        }

        food={
            x:appleX,
            y:appleY
        };

        return true;
    }

    const validPositions=[];

    for(let r=0;r<tileCount;r++){

        for(let c=0;c<tileCount;c++){

            const posX=c*gridSize;
            const posY=r*gridSize;

            let onSnake=false;

            for(const part of snake){

                if(
                    part.x===posX&&
                    part.y===posY
                ){
                    onSnake=true;
                    break;
                }
            }

            if(!onSnake){

                validPositions.push({
                    x:posX,
                    y:posY
                });

            }
        }
    }

    if(validPositions.length===0){
        return false;
    }

    food=
        validPositions[
            Math.floor(
                Math.random()*
                validPositions.length
            )
        ];

    return true;
}

function growSnake(amount=1){

    amount=Math.floor(Number(amount));

    if(
        !Number.isFinite(amount)||
        amount<1
    ){
        return false;
    }

    if(snake.length===0){
        return false;
    }

    for(let i=0;i<amount;i++){

        const tail=
            snake[snake.length-1];

        let newX=tail.x;
        let newY=tail.y;

        if(snake.length>=2){

            const previous=
                snake[snake.length-2];

            newX+=tail.x-previous.x;
            newY+=tail.y-previous.y;
        }

        snake.push({
            x:newX,
            y:newY
        });
    }

    return true;
}

function SetSnakeSize(size){

    size=Math.floor(Number(size));

    if(
        !Number.isFinite(size)||
        size<1
    ){
        return false;
    }

    if(snake.length===0){
        return false;
    }

    if(size<snake.length){

        snake.length=size;

    }else if(size>snake.length){

        growSnake(
            size-snake.length
        );
    }

    return true;
}

function win(){

    wins++;

    winsLabelEl.innerText=wins;

    saveProgress();
}

function togglePause(){

    if(snake.length===0){
        return;
    }

    isPaused=!isPaused;

    if(isPaused){

        clearInterval(gameInterval);

        gameInterval=null;

        pauseBtn.innerText='Resume';

    }else{

        clearInterval(gameInterval);

        gameInterval=
            setInterval(
                gameLoop,
                130
            );

        pauseBtn.innerText='Pause';
    }
}

function startGame(){

    menuEl.style.display='none';

    colorSelectorEl.style.display='none';
    colorLabelEl.style.display='none';

    menuTitleEl.innerText='Snake Game';

    snake=[
        {x:100,y:200},
        {x:80,y:200},
        {x:60,y:200}
    ];

    dx=gridSize;
    dy=0;

    score=0;

    changingDirection=false;
    isPaused=false;

    pauseBtn.innerText='Pause';

    updateScoreDisplay();

    addApple();

    clearInterval(gameInterval);

    gameInterval=
        setInterval(
            gameLoop,
            130
        );
}

function gameLoop(){

    if(isPaused){
        return;
    }

    if(score>=maxPossibleScore){

        gameWin();

        return;
    }

    if(hasGameEnded()){

        gameOver();

        return;
    }

    changingDirection=false;

    clearCanvas();

    drawFood();

    moveSnake();

    drawSnake();
}

function clearCanvas(){

    for(let r=0;r<tileCount;r++){

        for(let c=0;c<tileCount;c++){

            ctx.fillStyle=
                (r+c)%2===0
                ?'#A2D149'
                :'#AAD751';

            ctx.fillRect(
                c*gridSize,
                r*gridSize,
                gridSize,
                gridSize
            );
        }
    }
}

function drawSnake(){

    const secondary=
        getSecondaryColor(
            selectedColor
        );

    const tertiary=
        getTertiaryColor(
            selectedColor
        );

    snake.forEach((part,index)=>{

        ctx.fillStyle=
            index===0
            ?selectedColor
            :(index%2===0
                ?secondary
                :tertiary);

        ctx.beginPath();

        ctx.arc(
            part.x+gridSize/2,
            part.y+gridSize/2,
            gridSize/2-1,
            0,
            Math.PI*2
        );

        ctx.fill();
    });
}

function moveSnake(){

    const head={
        x:snake[0].x+dx,
        y:snake[0].y+dy
    };

    snake.unshift(head);

    if(
        snake[0].x===food.x&&
        snake[0].y===food.y
    ){

        score++;

        updateScoreDisplay();

        if(score>highScore){

            highScore=score;

            highScoreEl.innerText=
                highScore;

            saveProgress();
        }

        snake.pop();

        growSnake();

        if(score<maxPossibleScore){
            addApple();
        }

    }else{

        snake.pop();
    }
}

function drawFood(){

    if(score>=maxPossibleScore){
        return;
    }

    ctx.fillStyle='#E23A24';

    ctx.beginPath();

    ctx.arc(
        food.x+gridSize/2,
        food.y+gridSize/2,
        gridSize/2-2,
        0,
        Math.PI*2
    );

    ctx.fill();
}

function hasGameEnded(){

    const head=snake[0];

    if(
        head.x<0||
        head.x>=canvas.width||
        head.y<0||
        head.y>=canvas.height
    ){
        return true;
    }

    for(
        let i=1;
        i<snake.length;
        i++
    ){

        if(
            snake[i].x===head.x&&
            snake[i].y===head.y
        ){
            return true;
        }
    }

    return false;
}

function gameOver(){

    clearInterval(gameInterval);

    gameInterval=null;

    isPaused=false;

    pauseBtn.innerText='Pause';

    menuTitleEl.innerText='Game Over';

    colorSelectorEl.style.display='flex';

    colorLabelEl.style.display='block';

    menuEl.style.display='flex';

    updateColorSelection();

    saveProgress();
}

function gameWin(){

    clearInterval(gameInterval);

    gameInterval=null;

    isPaused=false;

    pauseBtn.innerText='Pause';

    win();

    menuTitleEl.innerText=
        'You Win! Perfect Game!';

    colorSelectorEl.style.display='flex';

    colorLabelEl.style.display='block';

    menuEl.style.display='flex';

    updateColorSelection();
}

function changeDirection(newDx,newDy){

    if(changingDirection){
        return;
    }

    if(
        newDx===-gridSize&&
        dx!==gridSize
    ){

        dx=-gridSize;
        dy=0;

        changingDirection=true;
    }

    if(
        newDy===-gridSize&&
        dy!==gridSize
    ){

        dx=0;
        dy=-gridSize;

        changingDirection=true;
    }

    if(
        newDx===gridSize&&
        dx!==-gridSize
    ){

        dx=gridSize;
        dy=0;

        changingDirection=true;
    }

    if(
        newDy===gridSize&&
        dy!==-gridSize
    ){

        dx=0;
        dy=gridSize;

        changingDirection=true;
    }
}

document.addEventListener('keydown',e=>{

    if(
        e.key==='ArrowLeft'||
        e.key==='a'
    ){
        changeDirection(
            -gridSize,
            0
        );
    }

    if(
        e.key==='ArrowUp'||
        e.key==='w'
    ){
        changeDirection(
            0,
            -gridSize
        );
    }

    if(
        e.key==='ArrowRight'||
        e.key==='d'
    ){
        changeDirection(
            gridSize,
            0
        );
    }

    if(
        e.key==='ArrowDown'||
        e.key==='s'
    ){
        changeDirection(
            0,
            gridSize
        );
    }
});

window.addEventListener(
    'touchstart',
    e=>{

        touchStartX=
            e.touches[0].clientX;

        touchStartY=
            e.touches[0].clientY;

    },
    {passive:true}
);

window.addEventListener(
    'touchend',
    e=>{

        if(
            !touchStartX||
            !touchStartY
        ){
            return;
        }

        const diffX=
            e.changedTouches[0].clientX-
            touchStartX;

        const diffY=
            e.changedTouches[0].clientY-
            touchStartY;

        if(
            Math.abs(diffX)>
            Math.abs(diffY)
        ){

            if(Math.abs(diffX)>30){

                changeDirection(
                    diffX>0
                    ?gridSize
                    :-gridSize,
                    0
                );
            }

        }else{

            if(Math.abs(diffY)>30){

                changeDirection(
                    0,
                    diffY>0
                    ?gridSize
                    :-gridSize
                );
            }
        }

        touchStartX=0;
        touchStartY=0;

    },
    {passive:true}
);

if (params.has('wins')) {
    const newWins = Number(params.get('wins'));

    if (Number.isFinite(newWins) && newWins >= 0) {
        wins = Math.floor(newWins);
        winsLabelEl.innerText = wins;
        saveProgress();
    }
}

loadProgress();
</script>
</body>
</html>
